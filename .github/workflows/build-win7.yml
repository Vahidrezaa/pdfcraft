name: Build for Windows 7 (x64)

on:
  push:
    branches: [win7-support]
  pull_request:
    branches: [win7-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout pdfcraft
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static -C link-arg=/SUBSYSTEM:WINDOWS,6.01"
          cargo build --release --target x86_64-pc-windows-msvc -p pdfcraft
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # --- 1. Executable ---
          $exe = Get-ChildItem -Path "target\x86_64-pc-windows-msvc\release" -Filter "pdfcraft*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "pdfcraft.exe not found"
            exit 1
          }
          Copy-Item $exe.FullName dist\
          Write-Host "Copied: $($exe.Name)"

          # --- 2. pdfium.dll ---
          $dll = Get-ChildItem -Path . -Filter "pdfium.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName dist\
            Write-Host "Copied: pdfium.dll from $($dll.FullName)"
          } else {
            Write-Error "pdfium.dll not found — printing will not work"
            exit 1
          }

          # --- 3. run_pdfcraft.bat ---
          @"
          @echo off
          set PDFCRAFT_RENDERER=gl
          start "" "%~dp0pdfcraft.exe"
          "@ | Out-File -Encoding ASCII dist\run_pdfcraft.bat
          Write-Host "Created: run_pdfcraft.bat"

          # --- 4. PdfCraft licenses ---
          Copy-Item NOTICE dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE-MIT dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE-APACHE dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE-document.txt dist\ -ErrorAction SilentlyContinue
          Write-Host "Copied: PdfCraft NOTICE and licenses"

          # --- 5. pdfium-binaries license ---
          Copy-Item third_party\PDFium-LICENSE.txt dist\ -ErrorAction SilentlyContinue
          Write-Host "Copied: PDFium-LICENSE.txt"

          # --- 6. Our docs ---
          Copy-Item README-WIN7.md dist\ -ErrorAction SilentlyContinue
          Copy-Item INSTALL.md dist\ -ErrorAction SilentlyContinue
          Write-Host "Copied: README-WIN7.md, INSTALL.md"

          # --- Summary ---
          Write-Host "=== Artifact contents ==="
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-win7-x64
          path: dist/*
          if-no-files-found: error
