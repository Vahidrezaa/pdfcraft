name: Build for Windows 7

on:
  push:
    branches: [win7-support]
  pull_request:
    branches: [win7-support]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            pdfium_url: https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz
          - target: i686-pc-windows-msvc
            arch: x86
            pdfium_url: https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x86.tgz
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: win7-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build pdfcraft (GUI)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static -C link-arg=/SUBSYSTEM:WINDOWS,6.01"
          cargo build --release --target ${{ matrix.target }} -p pdfcraft
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      - name: Build pdfcraft-cli (console)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static -C link-arg=/SUBSYSTEM:CONSOLE,6.01"
          cargo build --release --target ${{ matrix.target }} -p pdfcraft-cli

      - name: Download pdfium.dll
        shell: pwsh
        run: |
          $tgz = Join-Path $env:RUNNER_TEMP "pdfium.tgz"
          Invoke-WebRequest -Uri "${{ matrix.pdfium_url }}" -OutFile $tgz
          $extract = Join-Path $env:RUNNER_TEMP "pdfium"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $tgz -C $extract
          $dll = Get-ChildItem -Path $extract -Recurse -Filter "pdfium.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "pdfium.dll not found"; exit 1 }
          Copy-Item $dll.FullName "target\${{ matrix.target }}\release\pdfium.dll"
          Write-Host "pdfium.dll: $((Get-Item $dll.FullName).Length) bytes"

      - name: Package (MSI + portable zip)
        shell: pwsh
        run: .\packaging\windows\package.ps1 -SkipBuild -Arch ${{ matrix.arch }}

      - name: List output
        shell: pwsh
        run: Get-ChildItem dist\release | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-win7-${{ matrix.arch }}
          path: |
            dist\release\*.msi
            dist\release\*-portable.zip
          if-no-files-found: error
